autogenerated = 0

#my gtx 1050 mobile driver config
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = GBM_BACKEND,nvidia-drm

monitor=eDP-1,1920x1080@60,0x0,1
exec-once = caelestia shell -d
exec = hyprctl dispatch submap global
submap = global

$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin

input {
    kb_layout = tr
    kb_variant =
    kb_model =
    kb_rules =
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
        disable_while_typing = false
    }
}

# Apps
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, C, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, V, centerwindow,
bind = $mainMod, F, fullscreen
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit

# Caelestia launcher
bindi = Super, Super_L, global, caelestia:launcher
bindin = Super, catchall, global, caelestia:launcherInterrupt
bindin = Super, Q, global, caelestia:launcherInterrupt
bindin = Super, Return, global, caelestia:launcherInterrupt
bindin = Super, C, global, caelestia:launcherInterrupt
bindin = Super, E, global, caelestia:launcherInterrupt
bindin = Super, G, global, caelestia:launcherInterrupt
bindin = Super, V, global, caelestia:launcherInterrupt
bindin = Super, Space, global, caelestia:launcherInterrupt
bindin = Super, mouse:272, global, caelestia:launcherInterrupt
bindin = Super, mouse:273, global, caelestia:launcherInterrupt

# Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Swap windows
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d
bind = $mainMod SHIFT, h, swapwindow, l
bind = $mainMod SHIFT, l, swapwindow, r
bind = $mainMod SHIFT, k, swapwindow, u
bind = $mainMod SHIFT, j, swapwindow, d

# Mouse
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume & brightness
# Volume
bindle = , XF86AudioRaiseVolume, global, caelestia:volumeUp
bindle = , XF86AudioLowerVolume, global, caelestia:volumeDown
bindl  = , XF86AudioMute,        global, caelestia:volumeMute
bindl  = , XF86AudioMicMute,     global, caelestia:micMute

# Brightness
bindle = , XF86MonBrightnessUp,   global, caelestia:brightnessUp
bindle = , XF86MonBrightnessDown, global, caelestia:brightnessDown

# Notifications
bind = $mainMod, N, exec, caelestia shell drawers toggle sidebar

# Media
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Screenshotting
bind = , Print, exec, grimblast copy area
bind = SHIFT, Print, exec, grimblast copy screen

animations {
    enabled = true
    bezier = specialWorkSwitch, 0.05, 0.7, 0.1, 1
    bezier = emphasizedAccel, 0.3, 0, 0.8, 0.15
    bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
    bezier = standard, 0.2, 0, 0, 1
    animation = layersIn, 1, 4, emphasizedDecel, slide
    animation = layersOut, 1, 3, emphasizedAccel, slide
    animation = fadeLayers, 1, 4, standard
    animation = windowsIn, 1, 4, emphasizedDecel
    animation = windowsOut, 1, 3, emphasizedAccel
    animation = windowsMove, 1, 5, standard
    animation = workspaces, 1, 4, standard
    animation = specialWorkspace, 1, 3, specialWorkSwitch, slidefadevert 14%
    animation = fade, 1, 5, standard
    animation = fadeDim, 1, 5, standard
    animation = border, 1, 5, standard
}

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
    col.active_border = rgba(00b4d8ee) rgba(0077b6ee) 235deg
    col.inactive_border = rgba(0077b644)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0
    rounding_power = 0
    active_opacity = 0.96
    inactive_opacity = 0.88
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
}

exec-once = caelestia wallpaper -f /home/esef/wallpapers/wallpaper.png


#Heavily inspired by 1k2s
